name: Build exam cards

on:
  push:
    branches: [ develop, main ]
    paths:
      - "tex_form/**"
      - "exam_cards/questions.csv"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ develop, main ]
    paths:
      - "tex_form/**"
      - "exam_cards/questions.csv"
      - ".github/workflows/ci.yml"

jobs:
  build-exam-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build exam cards PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: tex_form
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -output-directory=../exam_cards

      - name: Rename PDF
        run: mv exam_cards/main.pdf exam_cards/exam_cards.pdf

      - name: Upload exam cards PDF
        uses: actions/upload-artifact@v4
        with:
          name: exam-cards-pdf
          path: exam_cards/exam_cards.pdf
