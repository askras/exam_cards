name: Build exam cards

on:
  push:
    branches: [ develop, main ]
    paths:
      - "tex_form/**"
      - "exam_cards/questions.csv"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ develop, main ]
    paths:
      - "tex_form/**"
      - "exam_cards/questions.csv"
      - ".github/workflows/ci.yml"

jobs:
  build-exam-cards:
    runs-on: ubuntu-latest

    # нужно для commit-back собранного PDF
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Воспроизводимая дата сборки → одинаковый исходник даёт одинаковый PDF,
      # поэтому commit-back не создаёт «пустых» коммитов при неизменном выводе.
      - name: Set reproducible build date (SOURCE_DATE_EPOCH)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build exam cards PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: tex_form
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -output-directory=../exam_cards

      - name: Rename PDF
        run: mv exam_cards/main.pdf exam_cards/exam_cards.pdf

      # Авто-обновление коммитнутого PDF: только на push (не на PR),
      # только если содержимое реально изменилось. Коммит помечен [skip ci],
      # и exam_cards.pdf вне paths-фильтра — повторного запуска CI не будет.
      - name: Commit rebuilt PDF
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam_cards/exam_cards.pdf
          if git diff --cached --quiet; then
            echo "PDF не изменился — коммитить нечего"
          else
            git commit -m "ci: rebuild exam_cards.pdf [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload exam cards PDF
        uses: actions/upload-artifact@v4
        with:
          name: exam-cards-pdf
          path: exam_cards/exam_cards.pdf
